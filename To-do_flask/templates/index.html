<main>
    <h1>My To-Do List</h1>

    <!-- Toggle Button -->
    <button id="toggle-add-task">Add Task</button>

    <!-- Add Task Form (hidden via CSS) -->
    <form id="add-task-form" action="{{ url_for('add_task') }}" method="POST" class="add-task-form hidden">
        <div>
            <label for="task">Task:</label>
            <input id="task" type="text" name="task" placeholder="clean room" required>
        </div>

        <div>
            <label for="status">Status:</label>
            <select id="status" name="status">
                <option value="Not Started">Not Started</option>
                <option value="In Progress">In Progress</option>
                <option value="Done">Done</option>
            </select>
        </div>

        <div>
            <label for="priority">Priority:</label>
            <select id="priority" name="priority">
                <option value="High">High</option>
                <option value="Medium" selected>Medium</option>
                <option value="Low">Low</option>
            </select>
        </div>

        <button type="submit">Add Task</button>
    </form>

    <!-- Task List -->
    {% if todo %}
        <ul id="task-list">
            {% for task in todo %}
                <li data-id="{{ task.id }}">
                    <span class="task-text">
                        <strong>{{ task.task }}:</strong>
                        {{ task.status }}
                        <strong>- Priority:</strong>
                        <span class="{{ task.priority|lower|trim }}">{{ task.priority|capitalize }}</span>
                    </span>

                    <!-- Hidden edit/delete form -->
                    <div class="task-form hidden">
                        <form action="{{ url_for('edit_task', task_id=task.id) }}" method="POST">
                            <input type="text" name="task" value="{{ task.task }}" required>
                            <select name="status">
                                <option value="Not Started" {% if task.status == "Not Started" %}selected{% endif %}>Not Started</option>
                                <option value="In Progress" {% if task.status == "In Progress" %}selected{% endif %}>In Progress</option>
                                <option value="Done" {% if task.status == "Done" %}selected{% endif %}>Done</option>
                            </select>
                            <select name="priority">
                                <option value="High" {% if task.priority == "High" %}selected{% endif %}>High</option>
                                <option value="Medium" {% if task.priority == "Medium" %}selected{% endif %}>Medium</option>
                                <option value="Low" {% if task.priority == "Low" %}selected{% endif %}>Low</option>
                            </select>
                            <button type="submit">Save</button>
                        </form>

                        <form action="{{ url_for('delete_task', task_id=task.id) }}" method="POST">
                            <button type="submit">Delete</button>
                        </form>
                    </div>
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <p>No tasks yet. Add one above!</p>
    {% endif %}
</main>
